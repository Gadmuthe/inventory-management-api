services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/inventory_db
      SECRET_KEY: ${SECRET_KEY:-local-only-change-this-secret}
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
